#
# Workflow CSDL "mirror" of the real orchestration graph
# (src/orchestrator/graph.py), to make it visible/navigable in the
# Microsoft Foundry project's visual canvas (Agents > Workflow tab).
#
# Hand-written from the official "Declarative Workflows" documentation
# (Microsoft Agent Framework - trigger-based structure / CSDL actions).
# There is no automatic exporter from the Python WorkflowBuilder to CSDL
# (DECISIONS.md #30): this file is a second artifact, distinct from the
# code that actually executes.
#
# IMPORTANT - what this file is NOT:
# - This is NOT the orchestration that actually executes: that remains
#   100% src/orchestrator/graph.py + executors.py (agents called directly
#   against Azure OpenAI, cf. src/agents/clients.py). This YAML is
#   hand-maintained so the TOPOLOGY (sequence, bounded reflection loop,
#   HITL gate) is visible in Foundry, not to be executed in production.
# - The six InvokeAzureAgent blocks below reference agents registered as
#   ExternalAgentDefinition (scripts/register_foundry_agents.py):
#   metadata-only entries, with no model/instructions on the Foundry side.
#   Clicking "Run Workflow" in the portal will therefore likely fail on the
#   first agent invocation - only the graph DISPLAY (nodes/edges/conditions)
#   is guaranteed to be useful. Real execution remains observable only via
#   Observability > Traces (docs/deployment.md section 8.12).
# - Must be resynced by hand if src/orchestrator/graph.py changes (confidence
#   threshold, max loop count, step order, etc.): see docs/deployment.md
#   section 8.14.
#
# To test in the portal's "Run Workflow" chat: paste the contents of
# data/payment-incident.log (or any other incident log) as the first
# message - it is captured by the `capture_raw_logs` action below.
#
kind: Workflow
trigger:

  kind: OnConversationStart
  id: incident_rca_workflow
  actions:

    # --- Capture the raw incident (1st message of the conversation) --------
    - kind: SetVariable
      id: capture_raw_logs
      displayName: Capture raw incident logs from first message
      variable: Local.RawLogs
      value: =System.LastMessage.Text

    # --- Bounded reflection loop state (cf. src/config.py) -----------------
    # CONFIDENCE_THRESHOLD and MAX_REFLECTION_LOOPS are "non-negotiable"
    # constants (CLAUDE.md): default values copied here (0.75 / 2) because
    # this standalone workflow has no access to Settings/.env.
    # Three SetVariable actions rather than a single SetMultipleVariables:
    # the latter does follow the documented form exactly (a `variables:`
    # map) but the Foundry API (preview) rejects it in practice with
    # "Missing required properties" (DECISIONS.md #30 addendum) - SetVariable
    # avoids this doc/API divergence risk by using only the simplest form.
    - kind: SetVariable
      id: init_loop_count
      displayName: Initialize loop_count
      variable: Local.loopCount
      value: 0

    - kind: SetVariable
      id: init_confidence_threshold
      displayName: Initialize confidence_threshold
      variable: Local.confidenceThreshold
      value: 0.75

    - kind: SetVariable
      id: init_max_reflection_loops
      displayName: Initialize max_reflection_loops
      variable: Local.maxReflectionLoops
      value: 2

    # --- Agent 1/6: LogAnalyzer -----------------------------------------------
    - kind: InvokeAzureAgent
      id: invoke_log_analyzer
      displayName: "Agent 1/6: LogAnalyzer"
      agent:
        name: LogAnalyzer
      conversationId: =System.ConversationId
      input:
        messages: =Local.RawLogs
      output:
        responseObject: Local.LogAnalysisResult
        autoSend: true

    # --- Agent 2/6: IncidentExtractor ------------------------------------------
    - kind: InvokeAzureAgent
      id: invoke_incident_extractor
      displayName: "Agent 2/6: IncidentExtractor"
      agent:
        name: IncidentExtractor
      conversationId: =System.ConversationId
      input:
        arguments:
          log_analysis: =Local.LogAnalysisResult
      output:
        responseObject: Local.IncidentResult
        autoSend: true

    # --- Agent 3/6: KBSearch ----------------------------------------------------
    - kind: InvokeAzureAgent
      id: invoke_kb_search
      displayName: "Agent 3/6: KBSearch"
      agent:
        name: KBSearch
      conversationId: =System.ConversationId
      input:
        arguments:
          incident: =Local.IncidentResult
      output:
        responseObject: Local.KbMatchesResult
        autoSend: true

    # --- Agent 4/6: RootCause (target of the loop's GotoAction, further down) --
    - kind: InvokeAzureAgent
      id: invoke_root_cause
      displayName: "Agent 4/6: RootCause"
      agent:
        name: RootCause
      conversationId: =System.ConversationId
      input:
        arguments:
          incident: =Local.IncidentResult
          log_analysis: =Local.LogAnalysisResult
          kb_matches: =Local.KbMatchesResult
      output:
        responseObject: Local.RootCauseResult
        autoSend: true

    # --- Bounded reflection loop ----------------------------------------------
    # Mirrors needs_more_evidence() (src/orchestrator/graph.py): loops back
    # if confidence < threshold AND loop_count < max. No "else" here: if the
    # condition is false, execution simply falls through to the HITL gate
    # right after this block (the sequence's next action).
    - kind: If
      id: check_needs_more_evidence
      displayName: Bounded reflection loop (confidence below threshold?)
      condition: =And(Local.RootCauseResult.confiance < Local.confidenceThreshold, Local.loopCount < Local.maxReflectionLoops)
      then:
        - kind: SetVariable
          id: increment_loop_count
          displayName: Increment loop_count (mirrors GatherEvidenceExecutor)
          variable: Local.loopCount
          value: =Local.loopCount + 1

        - kind: SendActivity
          id: send_routing_note
          displayName: Routing note (mirrors context.routing_note)
          activity:
            text: =Concat("Confidence ", Local.RootCauseResult.confiance, " is below threshold (loop ", Local.loopCount, "/", Local.maxReflectionLoops, ") — gathering more evidence. Missing -", Local.RootCauseResult.preuves_manquantes)

        # GatherEvidence (not a dedicated agent, DECISIONS.md #5): re-invokes
        # LogAnalyzer targeting the missing evidence, then refreshes
        # KBSearch, before looping back to RootCause.
        - kind: InvokeAzureAgent
          id: gather_evidence_log_analyzer
          displayName: "GatherEvidence: re-invoke LogAnalyzer (focused)"
          agent:
            name: LogAnalyzer
          conversationId: =System.ConversationId
          input:
            messages: =Local.RawLogs
            arguments:
              focus: =Local.RootCauseResult.preuves_manquantes
          output:
            responseObject: Local.LogAnalysisResult
            autoSend: true

        - kind: InvokeAzureAgent
          id: gather_evidence_kb_search
          displayName: "GatherEvidence: re-invoke KBSearch"
          agent:
            name: KBSearch
          conversationId: =System.ConversationId
          input:
            arguments:
              incident: =Local.IncidentResult
          output:
            responseObject: Local.KbMatchesResult
            autoSend: true

        - kind: GotoAction
          id: loop_back_to_root_cause
          displayName: Jump back to RootCause
          actionId: invoke_root_cause

    # --- HITL gate (src/orchestrator/executors.py HumanApprovalExecutor) ---
    # No remediation is proposed/displayed without explicit human approval
    # (CLAUDE.md - constraints not to bypass).
    # Real shape confirmed via the official ConfirmInput.yaml example from the
    # microsoft/agent-framework repo (dotnet/samples/03-workflows/Declarative/
    # ConfirmInput) - NOT the one documented by the Agent Framework tutorial
    # (question.text / variable), which was in fact rejected by the live
    # Foundry API (DECISIONS.md #30 addendum): the real field is `property`
    # (not `variable`), the prompt is `prompt.kind` + `prompt.text` (a list,
    # not a scalar `question.text`), and `entity` is mandatory.
    # StringPrebuiltEntity was chosen because it's already confirmed working
    # in the official example - so the downstream `= "yes"` comparison
    # remains valid (no unconfirmed boolean entity).
    - kind: Question
      id: human_approval_gate
      displayName: Human-in-the-loop approval gate
      alwaysPrompt: false
      autoSend: false
      property: Local.approved
      prompt:
        kind: Message
        text:
          - =Concat("Root cause hypothesis - ", Local.RootCauseResult.cause, " (confidence ", Local.RootCauseResult.confiance, "). Approve proceeding to remediation? (yes/no)")
      entity:
        kind: StringPrebuiltEntity
      default: "no"

    - kind: If
      id: check_approval
      displayName: Branch on human approval
      condition: =Local.approved = "yes"
      then:
        # --- Agent 5/6: Remediation (only if approved) ------------------------
        - kind: InvokeAzureAgent
          id: invoke_remediation
          displayName: "Agent 5/6: Remediation"
          agent:
            name: Remediation
          conversationId: =System.ConversationId
          input:
            arguments:
              incident: =Local.IncidentResult
              root_cause: =Local.RootCauseResult
              kb_matches: =Local.KbMatchesResult
          output:
            responseObject: Local.RemediationResult
            autoSend: true

        # --- Agent 6/6: Summary ------------------------------------------------
        - kind: InvokeAzureAgent
          id: invoke_summary
          displayName: "Agent 6/6: Summary"
          agent:
            name: Summary
          conversationId: =System.ConversationId
          input:
            arguments:
              incident: =Local.IncidentResult
              log_analysis: =Local.LogAnalysisResult
              root_cause: =Local.RootCauseResult
              remediation_plan: =Local.RemediationResult
              kb_matches: =Local.KbMatchesResult
          output:
            responseObject: Local.SummaryResult
            autoSend: true

        - kind: SendActivity
          id: send_final_report
          displayName: Send final incident report
          activity:
            text: =Local.SummaryResult.texte
      else:
        - kind: SendActivity
          id: send_declined_notice
          displayName: Human declined - stop without remediation
          activity:
            text: "Remediation declined by the human reviewer. Stopping without generating or displaying a remediation plan (no action is ever executed on a live system)."

    - kind: EndWorkflow
      id: end_workflow
      displayName: End workflow
